name: Deploy production to EC2

on:
  push:
    branches:
      - main

concurrency:
  group: beerry-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate backend and OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and validate OpenAPI
        run: pnpm docs:check

      - name: Run unit and contract tests
        run: pnpm test:unit --runInBand

  deploy:
    name: Deploy Beerry API
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: sa-east-1
      EC2_INSTANCE_ID: i-0b24a0d8042906648
      PROJECT_DIR: /home/ubuntu/Night-Club-Api

    steps:
      - name: Authenticate with AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::027677879174:role/GitHubBeerryDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Start EC2
        run: |
          aws ec2 start-instances \
            --instance-ids "$EC2_INSTANCE_ID"

          aws ec2 wait instance-running \
            --instance-ids "$EC2_INSTANCE_ID"

          aws ec2 wait instance-status-ok \
            --instance-ids "$EC2_INSTANCE_ID"

      - name: Wait for Systems Manager
        run: |
          for attempt in {1..60}; do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$EC2_INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text)

            if [ "$STATUS" = "Online" ]; then
              echo "Systems Manager está disponible."
              exit 0
            fi

            echo "Esperando a Systems Manager: intento $attempt/60"
            sleep 10
          done

          echo "Systems Manager no quedó disponible."
          exit 1

      - name: Execute deployment
        run: |
          PARAMETERS=$(jq -cn \
            --arg project "$PROJECT_DIR" \
            --arg commit "$GITHUB_SHA" \
            '{
              commands: [
                "set -eu",
                "sudo -u ubuntu -H git -C \($project) fetch origin \($commit)",
                "sudo -u ubuntu -H git -C \($project) merge --ff-only \($commit)",
                "test \"$(sudo -u ubuntu -H git -C \($project) rev-parse HEAD)\" = \"\($commit)\"",
                "sudo -u ubuntu -H \($project)/scripts/deploy-production.sh"
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy GitHub commit $GITHUB_SHA" \
            --timeout-seconds 900 \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for attempt in {1..120}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success)
                break
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "El despliegue terminó con estado: $STATUS"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID"

                exit 1
                ;;
            esac

            echo "Despliegue en ejecución: $STATUS"
            sleep 5
          done

          if [ "$STATUS" != "Success" ]; then
            echo "El despliegue excedió el tiempo de espera."
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{
              Status: Status,
              Output: StandardOutputContent,
              Error: StandardErrorContent
            }'
