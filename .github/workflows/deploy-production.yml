name: Deploy production to EC2

on:
  push:
    branches:
      - main

concurrency:
  group: beerry-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Beerry API
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      AWS_REGION: sa-east-1
      EC2_INSTANCE_ID: i-0b24a0d8042906648
      PROJECT_DIR: /home/ubuntu/Night-Club-Api

    steps:
      - name: Authenticate with AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::027677879174:role/GitHubBeerryDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Start EC2
        run: |
          aws ec2 start-instances \
            --instance-ids "$EC2_INSTANCE_ID"

          aws ec2 wait instance-running \
            --instance-ids "$EC2_INSTANCE_ID"

          aws ec2 wait instance-status-ok \
            --instance-ids "$EC2_INSTANCE_ID"

      - name: Wait for Systems Manager
        run: |
          for attempt in {1..60}; do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$EC2_INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text)

            if [ "$STATUS" = "Online" ]; then
              echo "Systems Manager está disponible."
              exit 0
            fi

            echo "Esperando a Systems Manager: intento $attempt/60"
            sleep 10
          done

          echo "Systems Manager no quedó disponible."
          exit 1

      - name: Execute deployment
        run: |
          PARAMETERS=$(jq -cn \
            --arg project "$PROJECT_DIR" \
            '{
              commands: [
                "sudo -u ubuntu -H git -C \($project) pull --ff-only origin main",
                "sudo -u ubuntu -H \($project)/scripts/deploy-production.sh"
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy GitHub commit $GITHUB_SHA" \
            --timeout-seconds 900 \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for attempt in {1..120}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success)
                break
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "El despliegue terminó con estado: $STATUS"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID"

                exit 1
                ;;
            esac

            echo "Despliegue en ejecución: $STATUS"
            sleep 5
          done

          if [ "$STATUS" != "Success" ]; then
            echo "El despliegue excedió el tiempo de espera."
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{
              Status: Status,
              Output: StandardOutputContent,
              Error: StandardErrorContent
            }'
